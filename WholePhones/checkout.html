<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whole Phones – Checkout</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1 class="site-title">Whole Phones</h1>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
  <a href="cart.html" class="cart-link">Cart <span class="cart-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1" fill="currentColor"/><circle cx="18" cy="20" r="1" fill="currentColor"/></svg></span><span id="cart-badge" class="cart-badge">0</span></a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Order Summary</h2>
    <div id="checkout-summary"></div>

    <h2>Shipping & Contact Information</h2>
    <form id="checkout-form">
      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" required />

      <label for="address">Address</label>
      <input id="address" name="address" required />

      <label for="city">City</label>
      <input id="city" name="city" required />

      <label for="state">State / Province</label>
      <input id="state" name="state" required />

      <label for="postal">Postal / ZIP</label>
      <input id="postal" name="postal" required />

      <label for="country">Country</label>
      <input id="country" name="country" required />

      <p>Payment will be completed on the payment portal. We do not collect card information here.</p>
      <button id="paymentBtn" type="button" class="btn">Ready for Payment</button>
    </form>
  </main>

  <script>
    // Populate summary from cart
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const summary = document.getElementById("checkout-summary");
    if (cart.length === 0) {
      summary.innerHTML = "<p>Your cart is empty.</p>";
    } else {
      cart.forEach(item => {
        const div = document.createElement("div");
        div.innerHTML = `<img src="${item.image}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;margin-right:8px;"> <strong>${item.name}</strong> – ${item.color}, ${item.storage} – ${item.price}`;
        summary.appendChild(div);
      });
    }

    // Placeholder: set your paymentPortalUrl here when ready
    let paymentPortalUrl = "https://your-payment-link.com";

    document.getElementById('paymentBtn').addEventListener('click', () => {
      const form = document.getElementById('checkout-form');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      // You can gather form data and send to your backend here before redirecting
      // For now, redirect to payment portal placeholder
      window.location.href = paymentPortalUrl;
    });
  </script>
  <script src="assets/js/header.js"></script>
</body>
</html>

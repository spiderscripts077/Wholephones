<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whole Phones – Product Details</title>
  <link rel="stylesheet" href="assets/css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1 class="site-title">Whole Phones</h1>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
  <a href="cart.html" class="cart-link">Cart <span class="cart-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1" fill="currentColor"/><circle cx="18" cy="20" r="1" fill="currentColor"/></svg></span><span id="cart-badge" class="cart-badge">0</span></a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <div id="product-details" class="product-details-grid">
      <div class="product-image-wrap">
        <img id="product-image" class="product-image" src="" alt="Product Image" />
      </div>
      <div class="product-meta">
        <h2 id="product-name"></h2>
          <p id="product-price"><span id="original-price" class="original-price"></span> <span id="discounted-price" class="discounted-price"></span></p>
          <p id="product-condition"></p>
          <div class="trust-badges">
            <span class="badge">30-day returns</span>
            <span class="badge">1-year warranty</span>
            <span class="badge">Fast & tracked shipping</span>
          </div>

      <label for="colorSelect">Choose Color:</label>
      <div class="option-tabs" id="colorSelect" role="tablist">
        <button type="button" class="option-tab active" data-value="Black" aria-pressed="true"><span class="check">✔</span>Black</button>
        <button type="button" class="option-tab" data-value="Silver" aria-pressed="false"><span class="check">✔</span>Silver</button>
        <button type="button" class="option-tab" data-value="Blue" aria-pressed="false"><span class="check">✔</span>Blue</button>
      </div>
      <div class="option-microcopy">Ships in 24 hours · Free returns within 30 days</div>

      <label for="storageSelect">Choose Storage:</label>
      <div class="option-tabs" id="storageSelect" role="tablist">
        <button type="button" class="option-tab active" data-value="128GB" aria-pressed="true"><span class="check">✔</span>128GB</button>
        <button type="button" class="option-tab" data-value="256GB" aria-pressed="false"><span class="check">✔</span>256GB</button>
        <button type="button" class="option-tab" data-value="512GB" aria-pressed="false"><span class="check">✔</span>512GB</button>
      </div>

        <button onclick="addToCart()" class="btn">Add to Cart</button>
      </div>
    </div>
    
    <div class="product-info-tabs">
      <div class="tabs">
        <button class="info-tab active" data-target="desc">Description</button>
        <button class="info-tab" data-target="details">Details</button>
      </div>
      <div class="tab-content" id="desc">
        <p id="product-description">This premium iPhone has been fully inspected and certified. It includes fast shipping and a limited warranty.</p>
      </div>
      <div class="tab-content hidden" id="details">
        <ul id="product-details-list" class="features-list">
          <!-- feature items will be injected here -->
        </ul>
      </div>
    </div>
  </main>

  <script src="assets/js/product.js"></script>
  <script src="assets/js/header.js"></script>
</body>
</html>
